[package]
name = "phantom-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Phantom browser desktop shell — GPUI chrome over wry webviews"
license = "MIT"
publish = false

[lib]
name = "phantom_desktop"
path = "src/lib.rs"

[[bin]]
name = "phantom"
path = "src/main.rs"

[features]
default = ["ui-shell", "webview-host"]
# GPUI-drawn browser chrome: tab strip, omnibox, menus, settings window.
ui-shell = ["dep:gpui"]
# wry-backed webview hosting with per-space isolated data directories.
webview-host = ["dep:wry"]

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
raw-window-handle = { version = "0.6", optional = true }
gpui = { version = "0.2", optional = true }
wry = { version = "0.57", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
