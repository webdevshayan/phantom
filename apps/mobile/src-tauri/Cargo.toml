[package]
name = "phantom-mobile"
version = "0.1.0"
description = "Phantom mobile browser: native core and shell"
edition = "2021"
rust-version = "1.77"

# Standalone workspace root: the release profile below must be
# authoritative for every build of this crate, regardless of any parent
# directory that happens to define its own workspace.
[workspace]

[lib]
name = "phantom_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
